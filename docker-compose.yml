version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: practinexo-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: practinexo
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
